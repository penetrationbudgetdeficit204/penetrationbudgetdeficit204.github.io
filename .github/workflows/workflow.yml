name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AEE3FB: ${{ secrets.AEE3FB }}
          B5390C: ${{ secrets.B5390C }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AEE3FB', '')
          tag_b = os.environ.get('B5390C', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- fa8e4ad257b9d1a1ae21ca6b5c16f44a0ed2c1e3 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- b1bf1536f8ed78703fc16f9e2e6e07dd942b7491fe33 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
